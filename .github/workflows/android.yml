name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.7
      - name: Fetch pinned llama.cpp
        run: ./scripts/fetch-llama.sh
      - name: Build the debug APK
        run: ./gradlew --no-daemon clean assembleDebug
      - name: Verify APK ABI
        run: python3 scripts/check-apk-abi.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify approved network scope
        run: python3 scripts/check-offline.py
      - name: Verify APK identity and API contract
        run: python3 scripts/check-apk-metadata.py app/build/outputs/apk/debug/app-debug.apk --application-id com.pocketmind --version-code 2 --version-name 0.1.1
      - name: Package APK with build provenance
        env:
          COMMIT_SHA: ${{ github.sha }}
          VERSION_CODE: "2"
          VERSION_NAME: "0.1.1"
        run: |
          mkdir -p dist
          apk="dist/PocketMind-v${VERSION_NAME}-vc${VERSION_CODE}-${COMMIT_SHA:0:7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          ( cd dist && sha256sum "$(basename "$apk")" > SHA256SUMS.txt )
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > dist/SIGNER.txt
          {
            printf 'commit=%s\n' "$COMMIT_SHA"
            printf 'applicationId=com.pocketmind\nversionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE"
            printf 'minSdk=30\ntargetSdk=30\nabi=armeabi-v7a\nINTERNET_permission=true\nnetwork_scope=explicit-model-called-web.search,api.discover,api.get\nlastPromptTokens=runtime-only\n'
          } > dist/BUILD_INFO.txt
      - name: Verify APK checksum
        run: (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: pocketmind-v0.1.1-vc2-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
