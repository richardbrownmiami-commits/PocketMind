name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.7
      - name: Fetch pinned llama.cpp
        run: ./scripts/fetch-llama.sh
      - name: Run unit tests and build the debug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug
      - name: Verify APK ABI
        run: python3 scripts/check-apk-abi.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify offline manifest source
        run: python3 scripts/check-offline.py
      - uses: actions/upload-artifact@v4
        with:
          name: pocketmind-armv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
